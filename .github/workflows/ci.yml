name: Sentinel CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml ruff bandit pytest build

      - name: Build Python package
        run: |
          python -m build --wheel

      - name: Install package wheel
        run: |
          pip install dist/*.whl

      - name: Validate Python syntax
        run: |
          python -m compileall src tests

      - name: Ruff lint check
        run: |
          ruff check src tests

      - name: Ruff formatting check
        run: |
          ruff format --check src tests

      - name: Security scan (Bandit)
        run: |
          bandit -r src

      - name: Validate YAML files
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          yaml_files = list(Path(".").glob("**/*.yml")) + list(Path(".").glob("**/*.yaml"))
          print(f"Validating {len(yaml_files)} YAML files...")
          for file in yaml_files:
              with open(file, "r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"  ✓ {file}")
          print("All YAML files validated successfully.")
          PY

      - name: Run unit tests
        run: |
          pytest -v

      - name: Verify required bundle files
        run: |
          test -f databricks.yml
          test -f resources/sentinel_job.yml
          test -f resources/sentinel_pipeline.yml

      - name: Verify production notebooks
        run: |
          test -e notebooks/09_incremental_gold_cdf.ipynb
          test -e notebooks/10_validate_gold.ipynb
          test -e notebooks/11_pipeline_observability.ipynb

  test-matrix:
    name: Matrix Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml pytest build
          python -m build --wheel
          pip install dist/*.whl

      - name: Run test suite
        run: |
          pytest -v
