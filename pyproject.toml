[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-lakehouse"
version = "0.2.0"
description = "Production-style Databricks Lakehouse engineering, GenAI, and autonomous AI agents"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "sqlglot>=20.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "build>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinel*"]

[tool.ruff]
target-version = "py311"
builtins = ["spark"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["src"]
