[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-lakehouse"
version = "0.1.0"
description = "Production-style Databricks Lakehouse engineering project"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinel*"]

[tool.ruff]
target-version = "py311"
builtins = ["spark"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"