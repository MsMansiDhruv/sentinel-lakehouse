bundle:
  name: sentinel-lakehouse

include:
  - resources/*.yml


artifacts:
  default:
    type: whl
    build: python -m build --wheel
    path: .


variables:
  catalog:
    description: Unity Catalog catalog
    default: sentinel_dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}