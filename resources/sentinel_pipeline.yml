resources:
  pipelines:
    sentinel_orders_pipeline:
      name: "Sentinel Orders Pipeline - ${bundle.target}"

      catalog: ${var.catalog}
      schema: silver

      configuration:
        sentinel.catalog: ${var.catalog}

      serverless: true

      libraries:
        - file:
            path: ../src/pipelines/orders_pipeline.py

      environment:
        dependencies:
          - ../dist/*.whl