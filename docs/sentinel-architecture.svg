<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161F33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Gold Accelerator Highlight Grad -->
    <linearGradient id="goldAccelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#1E1E38"/>
      <stop offset="100%" stop-color="#171A2E"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .flow-line {
        stroke-dasharray: 6 6;
        animation: flowDash 1.2s linear infinite;
      }
      .pulse-beacon {
        animation: pulseBeacon 2s ease-in-out infinite;
      }
      .radar-sweep {
        animation: radarRotate 4s linear infinite;
        transform-origin: 600px 330px;
      }
      .stream-particle {
        animation: streamMove 3s ease-in-out infinite;
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseBeacon {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8)); }
      }
      @keyframes streamMove {
        0% { opacity: 0; transform: translateY(0); }
        50% { opacity: 1; }
        100% { opacity: 0; transform: translateY(40px); }
      }
      .font-tech {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="660" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="660" rx="16" fill="url(#techGrid)"/>
  <rect width="1200" height="660" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(60, 35)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="1080" height="52" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="28" cy="26" r="6" fill="#10B981" class="pulse-beacon"/>
    <text x="44" y="31" fill="#F8FAFC" font-size="16" font-weight="700" class="font-tech" letter-spacing="0.5">
      SENTINEL LAKEHOUSE: MEDALLION ARCHITECTURE + ZERO-OVERHEAD GOLD ACCELERATOR
    </text>
    <rect x="850" y="14" width="210" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="0.8"/>
    <text x="955" y="30" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="600" class="font-tech">
      DATABRICKS + DELTA LAKE
    </text>
  </g>

  <!-- ==================== TIER 1: BRONZE INGESTION ==================== -->
  <g transform="translate(60, 120)">
    <!-- Main Card -->
    <rect x="0" y="0" width="230" height="480" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Header Pill -->
    <rect x="18" y="18" width="194" height="34" rx="8" fill="#78350F" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="34" cy="35" r="5" fill="#F59E0B"/>
    <text x="48" y="40" fill="#FDE68A" font-size="13" font-weight="700" class="font-tech">BRONZE TIER (RAW)</text>

    <!-- Sub-components -->
    <g transform="translate(18, 70)">
      <rect x="0" y="0" width="194" height="74" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="14" y="26" fill="#F8FAFC" font-size="12" font-weight="600" class="font-tech">Auto Loader Ingestion</text>
      <text x="14" y="46" fill="#94A3B8" font-size="10" class="font-tech">Incremental file discovery</text>
      <text x="14" y="60" fill="#94A3B8" font-size="10" class="font-tech">Unity Catalog Volumes</text>
    </g>

    <g transform="translate(18, 160)">
      <rect x="0" y="0" width="194" height="74" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="14" y="26" fill="#F8FAFC" font-size="12" font-weight="600" class="font-tech">Schema Evolution</text>
      <text x="14" y="46" fill="#94A3B8" font-size="10" class="font-tech">Automatic inference</text>
      <text x="14" y="60" fill="#94A3B8" font-size="10" class="font-tech">_rescued_data column</text>
    </g>

    <g transform="translate(18, 250)">
      <rect x="0" y="0" width="194" height="90" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#F8FAFC" font-size="12" font-weight="600" class="font-tech">bronze_orders</text>
      <text x="14" y="44" fill="#94A3B8" font-size="10" class="font-tech">Append-only Delta log</text>
      <text x="14" y="60" fill="#94A3B8" font-size="10" class="font-tech">Source file lineage</text>
      <text x="14" y="76" fill="#F59E0B" font-size="10" font-weight="600" class="font-tech">Ingestion Timestamp</text>
    </g>

    <!-- Stat Footer -->
