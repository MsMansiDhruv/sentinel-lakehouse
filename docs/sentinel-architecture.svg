    <circle cx="34" cy="39" r="6" fill="#10B981" class="pulse-beacon"/>
    <text x="48" y="44" fill="#A7F3D0" font-size="12.5" font-weight="800" class="font-tech">SENTINEL GOLD ACCELERATOR</text>

    <!-- Module 1: Zero-Scan SLA Gate -->
    <g transform="translate(16, 70)">
      <rect x="0" y="0" width="228" height="88" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.8"/>
      <text x="12" y="22" fill="#34D399" font-size="11.5" font-weight="700" class="font-tech">1. Delta Metadata SLA Gate</text>
      <text x="12" y="40" fill="#E2E8F0" font-size="10" class="font-tech">• Zero-Scan _delta_log inspection</text>
      <text x="12" y="55" fill="#E2E8F0" font-size="10" class="font-tech">• Partition SLA arrival check</text>
      <rect x="12" y="63" width="204" height="18" rx="4" fill="#064E3B" fill-opacity="0.4"/>
      <text x="114" y="76" text-anchor="middle" fill="#6EE7B7" font-size="9" font-weight="700">⚡ 99.9% DBU Cost Savings vs Scan</text>
    </g>

    <!-- Module 2: Rolling Window Contiguity -->
    <g transform="translate(16, 170)">
      <rect x="0" y="0" width="228" height="92" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#38BDF8" font-size="11.5" font-weight="700" class="font-tech">2. Rolling Window Contiguity</text>
      <text x="12" y="40" fill="#CBD5E1" font-size="10" class="font-tech">• [t-W, t] interval completeness</text>
      <text x="12" y="55" fill="#CBD5E1" font-size="10" class="font-tech">• Injects _dq_completeness_score</text>
      <text x="12" y="70" fill="#CBD5E1" font-size="10" class="font-tech">• Non-breaking quality markers</text>
      <text x="12" y="84" fill="#FBBF24" font-size="9" font-weight="600">Gating: DEGRADED / FAIL_FAST</text>
    </g>

