    <g transform="translate(16, 274)">
      <rect x="0" y="0" width="228" height="96" rx="8" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="12" y="22" fill="#C084FC" font-size="11.5" font-weight="700" class="font-tech">3. Blast-Radius Reconciler</text>
      <text x="12" y="40" fill="#E2E8F0" font-size="10" class="font-tech">• Detects late arrivals: t_late</text>
      <text x="12" y="55" fill="#E2E8F0" font-size="10" class="font-tech">• Bounds blast: [t_late, t_late+W-1]</text>
      <text x="12" y="70" fill="#E2E8F0" font-size="10" class="font-tech">• Targeted Delta MERGE in-place</text>
      <rect x="12" y="76" width="204" height="15" rx="3" fill="#581C87" fill-opacity="0.4"/>
      <text x="114" y="88" text-anchor="middle" fill="#E9D5FF" font-size="8.5" font-weight="700">Skips 98%+ of Historical Data</text>
