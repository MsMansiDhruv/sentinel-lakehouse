  <g transform="translate(345, 120)">
    <!-- Main Card -->
    <rect x="0" y="0" width="240" height="480" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Header Pill -->
    <rect x="18" y="18" width="204" height="34" rx="8" fill="#0369A1" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="34" cy="35" r="5" fill="#38BDF8"/>
    <text x="48" y="40" fill="#BAE6FD" font-size="13" font-weight="700" class="font-tech">SILVER TIER (CLEANSED)</text>

    <!-- Sub-components -->
    <g transform="translate(18, 70)">
