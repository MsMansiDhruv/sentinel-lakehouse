      <text x="12" y="20" fill="#F8FAFC" font-size="11" font-weight="600" class="font-tech">4. _sentinel_gold_quality_ledger</text>
      <text x="12" y="38" fill="#94A3B8" font-size="9.5" class="font-tech">Audit run history, breaches &amp; DBU savings</text>
